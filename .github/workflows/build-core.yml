name: Build DVD core

on:
  push:
    paths:
      - "fpga/**"
      - ".github/workflows/build-core.yml"
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The Quartus image is ~15 GB unpacked and does not fit in the default
      # runner free space, so drop the large preinstalled toolchains first.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - name: Compile DVD core (full Quartus flow)
        # Community Quartus image; the 17.0 tag is v17.0.2.602, matching the
        # local quartus-mister-rosetta toolchain (MiSTer requires 17.0.x).
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE/fpga:/build" -w /build \
            raetro/quartus:17.0 \
            sh -c 'quartus_sh --flow compile DVD.qpf'
          # output_files/ is root-owned by the container. Copy the candidate
          # RBF into the runner-owned workspace so artifact upload cannot
          # fail with "Permission denied" writing into that directory.
          # Experimental custom-Main identity bitstream.
          # Never reuse DVD_FPGA_YUV420_Test.rbf (known-good public) or
          # DVD_FPGA_YUV420_Production_RC1.rbf (strong pre-Main candidate).
          cp -f fpga/output_files/DVD.rbf "$GITHUB_WORKSPACE/DVD_FPGA_YUV420_DVDPlayer_Main.rbf"

      - name: Upload DVD_FPGA_YUV420_DVDPlayer_Main.rbf
        uses: actions/upload-artifact@v4
        with:
          name: DVD_FPGA_YUV420_DVDPlayer_Main.rbf
          path: DVD_FPGA_YUV420_DVDPlayer_Main.rbf
          if-no-files-found: error

      - name: Upload DVD.rbf
        uses: actions/upload-artifact@v4
        with:
          name: DVD.rbf
          path: fpga/output_files/DVD.rbf
          if-no-files-found: error

      - name: Upload compilation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quartus-reports
          path: |
            fpga/output_files/*.rpt
            fpga/output_files/*.summary
          if-no-files-found: ignore
